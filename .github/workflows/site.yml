name: Chiffres du clan et publication du site

on:
  push:
    branches: [main]        # à chaque modification du site
  schedule:
    - cron: "*/15 * * * *"  # toutes les 15 minutes (GitHub peut décaler un passage de quelques minutes)
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
    inputs:
      test_rapport:
        description: "Envoyer un rapport d'activité de test au staff"
        type: boolean
        default: false
      test_saison:
        description: "Envoyer le classement provisoire des meilleurs joueurs au staff"
        type: boolean
        default: false
      bases_maintenant:
        description: "Partager tout de suite les nouvelles bases et compos (sans attendre la vérification de l’heure)"
        type: boolean
        default: false
      fiche_joueur:
        description: "Envoyer au staff la fiche d'arrivée d'un joueur (son tag, ex. #LR8VQYUGR)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les outils d'image
        continue-on-error: true   # sans eux, les chiffres se mettent quand même à jour (seules les icônes restent celles de la page)
        run: pip install --quiet pillow numpy scipy

      - name: Récupérer les chiffres du clan
        continue-on-error: true   # si l'API ne répond pas, le site est publié quand même avec les chiffres écrits dans la page
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
        run: python3 .github/workflows/scripts/clan.py

      - name: Bilans de guerre et meilleurs joueurs (#général), rapport d'activité (staff) sur Discord
        continue-on-error: true   # un souci ici ne bloque jamais la publication du site
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          DISCORD_STAFF_WEBHOOK: ${{ secrets.DISCORD_STAFF_WEBHOOK }}
          DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
          STAFF_TEST: ${{ inputs.test_rapport }}
          STAFF_TEST_SAISON: ${{ inputs.test_saison }}
          FICHE_JOUEUR: ${{ inputs.fiche_joueur }}
        run: python3 .github/workflows/scripts/staff.py

      - name: Nouvelles bases et compos méta HDV 16 à 19 (Discord)
        continue-on-error: true   # un souci ici ne bloque jamais la publication du site
        env:
          DISCORD_BASES_WEBHOOK: ${{ secrets.DISCORD_BASES_WEBHOOK }}
          DISCORD_COMPOS_WEBHOOK: ${{ secrets.DISCORD_COMPOS_WEBHOOK }}
          BASES_FORCE: ${{ inputs.bases_maintenant }}
        run: python3 .github/workflows/scripts/bases.py

      - name: Nouveautés officielles de Clash of Clans (Discord, salon actus)
        continue-on-error: true
        env:
          DISCORD_ACTUS_WEBHOOK: ${{ secrets.DISCORD_ACTUS_WEBHOOK }}
        run: python3 .github/workflows/scripts/news.py

      - name: Publier le site sur Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3c759c515555f488f11bd3b164b0d77   # identifiant du compte Cloudflare (pas secret)
        run: |
          mkdir -p /tmp/site && rsync -a --exclude .git --exclude .github --exclude README.md ./ /tmp/site/
          npx --yes wrangler@3.99.0 pages project create gravaen --production-branch=main || true
          npx --yes wrangler@3.99.0 pages deploy /tmp/site --project-name=gravaen --branch=main
