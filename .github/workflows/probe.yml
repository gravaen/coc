name: Sonde API ClashKing (temporaire)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 25 https://api.clashk.ing/openapi.json > o.json
          for u in "v2/dates/current" "v2/dates/season-start-end?season=2026-11" "v2/dates/seasons" "v2/player/%2320RGY8082/activity-summary" "v2/player/%2320RGY8082/last-activity" "v2/dates/season-raid-dates"; do
            echo "=== $u"; curl -s -m 25 -w '\nHTTP %{http_code}\n' "https://api.clashk.ing/$u" | head -c 1200; echo; done
